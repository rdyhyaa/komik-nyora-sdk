<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaze Komik (Komiku)</title>
<style>
  body { font-family: sans-serif; background: #121212; color: #fff; padding: 15px; }
  h1 { color: #ff3d00; text-align: center; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #333; }
  .card img { width: 100%; height: 160px; object-fit: cover; background: #333; }
  .card p { font-size: 12px; margin: 8px; text-align: center; font-weight: bold; }
  #detail, #reader { display: none; padding: 15px; }
  .back { background: #ff3d00; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; cursor: pointer; }
  .ch-item { background: #1e1e1e; padding: 12px; margin-bottom: 8px; border-radius: 5px; cursor: pointer; border: 1px solid #333; }
  #reader img { width: 100%; display: block; margin-bottom: 5px; }
</style>
</head>
<body>

<div id="home">
  <h1>🥷 Kaze Komik (Komiku)</h1>
  <div id="grid"><p>Memuat data...</p></div>
</div>

<div id="detail">
  <button class="back" onclick="kembali()">← Kembali</button>
  <div id="detail-info"></div>
  <h3>Daftar Chapter</h3>
  <div id="chapter-list"></div>
</div>

<div id="reader">
  <button class="back" onclick="tutupReader()">← Tutup</button>
  <div id="reader-img"></div>
</div>

<script>
// GANTI INI SAMA URL VERCEL LO NANTI
const API_URL = 'https://kaze-scraper.vercel.app';

async function loadKomik() {
  try {
    const res = await fetch(API_URL + '/api/komik');
    const data = await res.json();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    data.manga_list.forEach(m => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => bukaDetail(m.endpoint);
      card.innerHTML = `<img src="${m.thumb}" loading="lazy"><p>${m.title}</p>`;
      grid.appendChild(card);
    });
  } catch (e) {
    document.getElementById('grid').innerHTML = '<p style="color:red;">Gagal memuat data. Pastikan server lo jalan.</p>';
  }
}

async function bukaDetail(endpoint) {
  document.getElementById('home').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('chapter-list').innerHTML = '<p>Memuat chapter...</p>';
  window.scrollTo(0,0);
  
  try {
    const res = await fetch(API_URL + '/api/komik/' + endpoint);
    const data = await res.json();
    
    document.getElementById('detail-info').innerHTML = `
      <h2>${data.title}</h2>
      <p>${data.description ? data.description.substring(0, 200) : ''}...</p>
    `;
    
    const list = document.getElementById('chapter-list');
    list.innerHTML = '';
    data.chapter_list.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'ch-item';
      div.innerText = ch.chapter;
      div.onclick = () => bacaChapter(ch.endpoint);
      list.appendChild(div);
    });
  } catch (e) {
    document.getElementById('chapter-list').innerHTML = '<p style="color:red;">Gagal memuat chapter.</p>';
  }
}

async function bacaChapter(endpoint) {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  document.getElementById('reader-img').innerHTML = '<p>Memuat gambar...</p>';
  window.scrollTo(0,0);
  
  try {
    const res = await fetch(API_URL + '/api/chapter/' + endpoint);
    const data = await res.json();
    const container = document.getElementById('reader-img');
    container.innerHTML = '';
    
    data.images.forEach(imgUrl => {
      const img = document.createElement('img');
      img.src = imgUrl;
      img.loading = 'lazy';
      container.appendChild(img);
    });
  } catch (e) {
    document.getElementById('reader-img').innerHTML = '<p style="color:red;">Gagal memuat gambar.</p>';
  }
}

function kembali() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('home').style.display = 'block';
}
function tutupReader() {
  document.getElementById('reader').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('reader-img').innerHTML = '';
}

loadKomik();
</script>
</body>
</html>
